version: '3.8'

services:
  trader:
    build: .
    container_name: atr-trader-lgbm
    restart: unless-stopped
    volumes:
      # Persist live trading logs on the host
      - ./logs:/app/logs
      # Mount .env so settings can be changed without rebuilding image
      - .env:/app/.env
      # Mount data folder — includes the trained LightGBM model and any future models
      - ./data:/app/data
    environment:
      # Pass critical settings as environment variables (override settings.py defaults)
      - PAPER_TRADING=true
      - TRADING_SYMBOL=SOL/USDT
      - CANDLE_INTERVAL=1m
      - INITIAL_CAPITAL=10000
      - CONFIDENCE_THRESHOLD=0.48
      - MODEL_PATH=data/models/lightgbm_SOLUSDT.pkl
      - MODEL_TYPE=xgboost
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
