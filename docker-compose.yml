version: '3.8'

services:
  sol-trader:
    build: .
    container_name: atr-trader-sol
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - .env:/app/.env
      - ./data:/app/data
    environment:
      - PAPER_TRADING=true
      - TRADING_SYMBOL=SOL/USDT
      - CANDLE_INTERVAL=1m
      - INITIAL_CAPITAL=10000
      - CONFIDENCE_THRESHOLD=0.42
      - MODEL_PATH=data/models/lightgbm_universal.pkl
      - MODEL_TYPE=xgboost
      - LEVERAGE=2.0
      - SELL_ONLY=true
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

