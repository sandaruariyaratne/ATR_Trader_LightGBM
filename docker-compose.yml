version: '3.8'

services:
  avax-trader:
    build: .
    container_name: atr-trader-avax
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - .env:/app/.env
      - ./data:/app/data
    environment:
      - PAPER_TRADING=false
      - SANDBOX=true
      - TRADING_SYMBOL=AVAX/USDT
      - CANDLE_INTERVAL=1m
      - INITIAL_CAPITAL=10000
      - CONFIDENCE_THRESHOLD_BUY=0.48
      - CONFIDENCE_THRESHOLD_SELL=0.42
      - MODEL_PATH=data/models/lightgbm_universal.pkl
      - MODEL_TYPE=xgboost
      - LEVERAGE=2.0
      - SELL_ONLY=false
      - PYTHONUNBUFFERED=1
      - ORDER_TYPE=limit
      - STOP_LOSS_ATR_MULT=2.0
      - TAKE_PROFIT_ATR_MULT=3.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
